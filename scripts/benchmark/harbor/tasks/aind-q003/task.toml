version = "1.0"

[metadata]
question_id = 3
complexity = "medium"
benchmark = "aind-data-mcp"
verify_mode = "llm"

[verifier]
timeout_sec = 300.0

[verifier.env]
# Claude Code's subscription OAuth token is passed through this variable.
JUDGE_MODEL = "${JUDGE_MODEL:-anthropic/claude-sonnet-5}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 900.0

[[environment.mcp_servers]]
name = "aind-data-mcp"
transport = "stdio"
command = "aind-data-mcp"
