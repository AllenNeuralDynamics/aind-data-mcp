version = "1.0"

[metadata]
question_id = 14
complexity = "hard"
benchmark = "aind-data-mcp"
verify_mode = "llm"

[verifier]
# Claude Code's subscription OAuth token is passed through this variable.
JUDGE_MODEL = "${JUDGE_MODEL:-anthropic/claude-sonnet-5}"
AWS_SECRET_ACCESS_KEY = "${AWS_SECRET_ACCESS_KEY:-}"
AWS_SESSION_TOKEN = "${AWS_SESSION_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 900.0

[[environment.mcp_servers]]
name = "aind-data-mcp"
transport = "stdio"
command = "aind-data-mcp"
